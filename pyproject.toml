[tool.poetry]
name = "ai-sdlc-poc"
version = "0.1.0"
description = "AI-Governed SDLC Proof of Concept - Local development stack with guardrails, CI/CD, and AI agents"
authors = ["Your Name <you@company.local>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"

# -- Application ----------------------------------------------
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
sqlalchemy = "^2.0.29"
alembic = "^1.13.1"
python-dotenv = "^1.0.1"

# -- AI Agents ------------------------------------------------
# crewai 0.80+ is standalone - no longer depends on langchain directly.
# Use crewai's built-in LLM class; anthropic SDK for direct API calls.
crewai = {version = "^0.80.0", python = ">=3.10,<=3.13"}
anthropic = "^0.40.0"

# -- Security Scanning ----------------------------------------
detect-secrets = "^1.5.0"

# -- Observability --------------------------------------------
prometheus-client = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.6"
pytest-mock = "^3.14.0"
httpx = "^0.27.0"
flake8 = "^7.0.0"
flake8-docstrings = "^1.7.0"
mypy = "^1.10.0"
black = "^24.4.2"
isort = "^5.13.2"
pre-commit = "^3.7.0"
types-requests = "^2.31.0"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app/src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
