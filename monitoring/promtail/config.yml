server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: jenkins_builds
    static_configs:
      - targets:
          - localhost
        labels:
          job: jenkins
          __path__: /var/jenkins_home/jobs/*/builds/*/log

  - job_name: jenkins_pipeline
    pipeline_stages:
      - json:
          expressions:
            build: build
            developer: developer
            ai_tool: ai_tool
            status: status
      - labels:
          build:
          developer:
          ai_tool:
          status:
    static_configs:
      - targets:
          - localhost
        labels:
          job: jenkins_structured
          __path__: /var/jenkins_home/logs/*.log
