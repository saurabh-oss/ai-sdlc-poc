global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'ai-sdlc-poc'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'jenkins_.*|pipeline_.*|sast_.*|secret_.*|test_.*|ai_.*|build_.*|policy_.*|guardrail_.*|code_quality_.*|lifecycle_.*|pii_.*|compliance_.*|defect_.*|estimated_.*'
        action: keep

  - job_name: 'jenkins'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['jenkins:8080']
