# Local port remap: ports 3000, 8080 and 9090 are used by another
# Docker project on this workstation. The !override tag replaces the
# base port list instead of appending to it.
# Internal service-to-service URLs are unaffected: they use container names.
services:

  gitea-server:
    ports: !override
      - "3010:3000"
      - "2222:22"
    environment:
      - GITEA__server__ROOT_URL=http://localhost:3010/

  jenkins-server:
    ports: !override
      - "8081:8080"
      - "50000:50000"

  prometheus:
    ports: !override
      - "9092:9090"

  # Headless Chromium renderer so dashboards can be exported as PNG from
  # inside Docker. Internal only - no host port published.
  renderer:
    image: grafana/grafana-image-renderer:3.10.1
    container_name: grafana-renderer
    environment:
      - ENABLE_METRICS=false
      - RENDERING_MODE=default
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
    networks:
      - ai-sdlc-net
    restart: unless-stopped

  grafana:
    environment:
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_LOG_FILTERS=rendering:info
    depends_on:
      - renderer
